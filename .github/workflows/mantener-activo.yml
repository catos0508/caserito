# EmprenLive — consulta la base de datos una vez al día para que Supabase (plan gratis) no pause el proyecto por inactividad.
# Usa solo la clave pública (la misma que ya está en la app y en esta página). No cuesta nada: este repositorio es público.
name: Mantener activo
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar EmprenLive
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_Osm049nAqujqAtTNdGidxQ_r-j_2qgp" \
            "https://otxigqqzczzsckhsaggq.supabase.co/rest/v1/stores?select=id&limit=1")
          echo "Respuesta: $code"
          test "$code" = "200"
